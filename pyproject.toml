[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rextio-torch"
dynamic = ["version"]
description = "Public Alpha Rextio plugin with proven CPU lowering and a build-only CUDA candidate for tch (plugin API 1.6)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Steve Si-young Song", email = "rextio.co@gmail.com"}
]
keywords = ["rextio", "pytorch", "torch", "tch", "rust", "compiler", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Build Tools",
]
# Core floor for plugin API 1.6. Torch is pinned to tch 0.24.0 /
# libtorch baseline; the plugin facade and types vocabulary deliberately never
# import torch so discovery stays import-minimal.
dependencies = [
  "rextio>=0.1.6,<0.2",
  "torch==2.11.0",
]

[project.urls]
Homepage = "https://github.com/rextio/rextio-torch"
Repository = "https://github.com/rextio/rextio-torch"
Issues = "https://github.com/rextio/rextio-torch/issues"
Changelog = "https://github.com/rextio/rextio-torch/blob/main/CHANGELOG.md"

[project.entry-points."rextio.plugins"]
rextio-torch = "rextio_torch.plugin:plugin"

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]
benchmark = [
  "numpy==2.4.6",
]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.22",
  "mypy==2.3.0",
  "build==1.5.0",
  # torch 2.11.0 requires setuptools<82 in the runtime environment. The
  # separate no-isolation build environment uses the exact 82.0.1 build pin.
  "setuptools==81.0.0",
  "wheel==0.47.0",
  "twine==6.2.0",
  "check-wheel-contents==0.6.3",
]

[tool.setuptools.dynamic]
version = {attr = "rextio_torch.__about__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "needs_cargo: builds and executes a real Rust extension against torch 2.11; serialize these tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "benchmarks", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "D"]
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"benchmarks/**" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
