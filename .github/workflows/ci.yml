name: CI

on:
  push:
    branches: [main, 0.1.2]
  pull_request:
    branches: [main, 0.1.2]
  workflow_dispatch:

concurrency:
  group: torch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  RUST_TOOLCHAIN: "1.93.1"
  CORE_COMMIT: "7f47f0ce8cea0b6dbeb7fd3c733f65eeaa6bb5e0"
  CUDA_PROVIDER_COMMIT: "a5fb427e91710b65f54ee5b8e33706c45840cf9c"

jobs:
  quality:
    name: Quality (CPython 3.11)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up CPython 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install lightweight quality dependencies
        run: |
          python -m pip install "pip==26.1"
          python -m pip install \
            "git+https://github.com/rextio/rextio.git@${CORE_COMMIT}" \
            "pytest==9.1.1" \
            "ruff==0.15.22" \
            "mypy==2.3.0"
          python -m pip install --no-deps -e .
      - name: Ruff
        run: ruff check src tests benchmarks scripts
      - name: Mypy
        run: mypy
      - name: Unit and contract tests
        run: python -m pytest -q tests --ignore=tests/e2e

  core-compatibility:
    name: Core compatibility (unreleased API 1.6 source)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up CPython 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install the selected Core and contract-test dependencies
        run: |
          python -m pip install "pip==26.1"
          python -m pip install \
            "git+https://github.com/rextio/rextio.git@${CORE_COMMIT}" \
            "pytest==9.1.1"
          python -m pip install --no-deps -e .
      - name: Exercise plugin registration compatibility
        run: python -m pytest -q tests/test_plugin.py

  platform-contract:
    name: Platform contract (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86
            expected: unsupported
          - os: linux
            arch: x64
            expected: experimental
          - os: linux
            arch: arm32
            expected: unsupported
          - os: linux
            arch: arm64
            expected: experimental
          - os: macos
            arch: x86
            expected: unsupported
          - os: macos
            arch: x64
            expected: availability-gated
          - os: macos
            arch: arm32
            expected: unsupported
          - os: macos
            arch: arm64
            expected: certified
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up CPython 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install contract package without backend runtime
        run: |
          python -m pip install "pip==26.1"
          python -m pip install --no-deps -e .
      - name: Validate declared result
        run: >-
          python -m rextio_torch.platforms
          --os "${{ matrix.os }}"
          --arch "${{ matrix.arch }}"
          --expect "${{ matrix.expected }}"

  native-e2e:
    name: Native E2E (${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-x64
            runner: ubuntu-24.04
            os: linux
            arch: x64
            expected: experimental
            machine: x86_64
          - profile: macos-arm64
            runner: macos-15
            os: macos
            arch: arm64
            expected: certified
            machine: arm64
    env:
      LIBTORCH_USE_PYTORCH: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up CPython 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update
          rustup default "${RUST_TOOLCHAIN}"
          test "$(rustc --version | awk '{print $2}')" = "${RUST_TOOLCHAIN}"
      - name: Restore Cargo dependency cache
        # Do not set/cache CARGO_TARGET_DIR: core discovers each generated
        # native artifact in that generated project's own target/release.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rextio-torch-${{ runner.os }}-${{ runner.arch }}-rust-1.93.1-tch-0.24.0-${{ hashFiles('pyproject.toml') }}
      - name: Build and install the wheel in a dedicated certification environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "pip==26.1"
          .venv/bin/python -m pip install \
            "build==1.5.0" "setuptools==82.0.1" "wheel==0.47.0"
          .venv/bin/python -m build --wheel --no-isolation
          # torch 2.11.0 requires setuptools<82 at runtime; the build above has
          # already consumed the separately pinned 82.0.1 build environment.
          .venv/bin/python -m pip install \
            "setuptools==81.0.0" \
            "git+https://github.com/rextio/rextio.git@${CORE_COMMIT}" \
            "torch==2.11.0" "pytest==9.1.1"
          .venv/bin/python -m pip install --no-deps dist/*.whl
          # The exact 0.1.6 branch commit still reports package version 0.1.5
          # before the aggregate release. Do not weaken the declared >=0.1.6
          # floor or pretend `pip check` can pass during this cross-repo train.
      - name: Verify runner, pins, and profile
        run: |
          .venv/bin/python - <<'PY'
          import os
          import platform
          import sys
          import torch

          expected_machine = "${{ matrix.machine }}"
          assert platform.machine() == expected_machine, (platform.machine(), expected_machine)
          assert sys.version_info[:2] == (3, 11)
          assert torch.__version__.split("+")[0] == "2.11.0"
          assert os.environ["LIBTORCH_USE_PYTORCH"] == "1"
          assert "LIBTORCH_BYPASS_VERSION_CHECK" not in os.environ
          PY
          .venv/bin/python -m rextio_torch.platforms \
            --os "${{ matrix.os }}" \
            --arch "${{ matrix.arch }}" \
            --expect "${{ matrix.expected }}" \
            --require-native
      - name: Run real Cargo certification slices
        run: |
          command -v cargo
          test -x .venv/bin/python
          .venv/bin/python -m pytest -q -rs -o pythonpath= \
            --junitxml=native-e2e.xml tests/e2e -m needs_cargo
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("native-e2e.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          totals = {
              name: sum(int(suite.attrib.get(name, "0")) for suite in suites)
              for name in ("tests", "failures", "errors", "skipped")
          }
          assert totals["tests"] >= 2, totals
          assert totals["failures"] == totals["errors"] == totals["skipped"] == 0, totals
          PY

  package:
    name: Package gate (wheel and sdist)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up CPython 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install package tooling
        run: |
          python -m pip install "pip==26.1"
          python -m pip install \
            "build==1.5.0" \
            "setuptools==82.0.1" \
            "wheel==0.47.0" \
            "twine==6.2.0" \
            "check-wheel-contents==0.6.3"
      - name: Assert the public Alpha release metadata
        run: |
          python - <<'PY'
          import tomllib

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          assert "Private :: Do Not Upload" not in project["classifiers"]
          assert "Development Status :: 3 - Alpha" in project["classifiers"]
          assert "torch==2.11.0" in project["dependencies"]
          assert "rextio>=0.1.6,<0.2" in project["dependencies"]
          PY
      - name: Build wheel and sdist
        run: |
          rm -rf build dist
          python -m build --no-isolation
      - name: Validate artifacts
        run: |
          python -m twine check dist/*
          check-wheel-contents dist/*.whl
      - name: Audit and exercise extracted sdist fixtures
        run: |
          rm -rf /tmp/rextio-torch-sdist-audit /tmp/rextio-torch-sdist-tests
          python scripts/check_sdist.py dist/*.tar.gz \
            --extract-to /tmp/rextio-torch-sdist-audit
          python -m venv /tmp/rextio-torch-sdist-tests
          audit_python=/tmp/rextio-torch-sdist-tests/bin/python
          "$audit_python" -m pip install "pip==26.1"
          "$audit_python" -m pip install \
            "git+https://github.com/rextio/rextio.git@${CORE_COMMIT}" "pytest==9.1.1"
          extracted_root="$(find /tmp/rextio-torch-sdist-audit \
            -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$extracted_root"
          (
            cd "$extracted_root"
            "$audit_python" -m pytest -q \
              tests/test_benchmark_harness.py \
              tests/test_phase_b_benchmark_harness.py \
              tests/test_analyzer_phase_b_chain.py \
              tests/test_platform_contract.py \
              tests/test_import_minimal.py
          )
      - name: Fresh wheel and sdist install smoke (import-minimal)
        run: |
          python -m venv /tmp/rextio-torch-wheel
          /tmp/rextio-torch-wheel/bin/python -m pip install "pip==26.1"
          /tmp/rextio-torch-wheel/bin/python -m pip install \
            "git+https://github.com/rextio/rextio.git@${CORE_COMMIT}"
          /tmp/rextio-torch-wheel/bin/python -m pip install --no-deps dist/*.whl
          python -m venv /tmp/rextio-torch-sdist
          /tmp/rextio-torch-sdist/bin/python -m pip install "pip==26.1"
          /tmp/rextio-torch-sdist/bin/python -m pip install \
            "git+https://github.com/rextio/rextio.git@${CORE_COMMIT}"
          /tmp/rextio-torch-sdist/bin/python -m pip install \
            "setuptools==82.0.1" "wheel==0.47.0"
          /tmp/rextio-torch-sdist/bin/python -m pip install \
            --no-build-isolation --no-deps dist/*.tar.gz
          for env_dir in /tmp/rextio-torch-wheel /tmp/rextio-torch-sdist; do
            "$env_dir/bin/python" - <<'PY'
          from importlib.metadata import distribution, entry_points

          dist = distribution("rextio-torch")
          assert dist.version == "0.1.2"
          requires = set(dist.requires or ())
          assert "torch==2.11.0" in requires
          factory = next(
              ep for ep in entry_points(group="rextio.plugins") if ep.name == "rextio-torch"
          ).load()
          assert factory().api_version == "1.6"
          PY
          done

  cuda-build-only:
    name: CUDA E2 build-only (Linux x86_64, no runtime claim)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBTORCH_USE_PYTORCH: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up CPython 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update
          rustup default "${RUST_TOOLCHAIN}"
      - name: Install frozen pre-release contracts without dependency resolution
        run: |
          python -m pip install "pip==26.1"
          python -m pip install \
            "git+https://github.com/rextio/rextio.git@${CORE_COMMIT}" \
            "torch==2.11.0" "pytest==9.1.1"
          python -m pip install --no-deps \
            "git+https://github.com/rextio/rextio-device-cuda.git@${CUDA_PROVIDER_COMMIT}"
          python -m pip install --no-deps -e .
      - name: Verify exact API and provider capability inputs
        run: |
          python - <<'PY'
          import json
          import platform
          from importlib.metadata import distribution, entry_points
          from rextio.plugins.api import PLUGIN_API_VERSION
          from rextio_torch.plugin import plugin
          import torch

          assert PLUGIN_API_VERSION == "1.6"
          assert platform.machine() == "x86_64"
          assert plugin().api_version == "1.6"
          assert torch.__version__.split("+")[0] == "2.11.0"
          assert torch.version.cuda is not None
          assert torch.cuda.is_available() is False
          for package, commit in (
              ("rextio", "7f47f0ce8cea0b6dbeb7fd3c733f65eeaa6bb5e0"),
              ("rextio-device-cuda", "a5fb427e91710b65f54ee5b8e33706c45840cf9c"),
          ):
              direct = json.loads(distribution(package).read_text("direct_url.json"))
              assert direct["vcs_info"]["commit_id"] == commit
          factory = next(
              ep for ep in entry_points(group="rextio.device_providers")
              if ep.name == "rextio-device-cuda"
          ).load()
          manifest = factory().manifest()
          assert any(
              item.id == "cuda-libtorch-linux-x86_64"
              for item in manifest.capabilities
          )
          PY
      - name: Run CUDA contract tests without a GPU
        run: python -m pytest -q tests/test_cuda_e2_build_only.py
      - name: Orchestrate and compile the generated CUDA candidate without loading it
        run: |
          unset LIBTORCH_BYPASS_VERSION_CHECK
          python scripts/build_cuda_candidate.py --output /tmp/rextio-torch-cuda-build-only

  ci-gate:
    name: CI gate
    if: always()
    needs: [quality, core-compatibility, platform-contract, native-e2e, package, cuda-build-only]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every blocking lane
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.core-compatibility.result }}" = "success"
          test "${{ needs.platform-contract.result }}" = "success"
          test "${{ needs.native-e2e.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
          test "${{ needs.cuda-build-only.result }}" = "success"
